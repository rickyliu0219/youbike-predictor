<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, 'Segoe UI', 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:1.6}
      .sub{fill:#fff;stroke:#111;stroke-width:1}
      .t{font-size:16px;font-weight:700;fill:#111}
      .s{font-size:12.5px;fill:#333}
      .h{font-size:12.5px;font-weight:600;fill:#111}
      .l{font-size:12px;fill:#444}
      .ln{stroke:#111;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="400" fill="#fff"/>

  <rect class="box" x="30" y="130" width="200" height="140" rx="14"/>
  <text class="t" x="130" y="162" text-anchor="middle">Browser</text>
  <text class="s" x="130" y="188" text-anchor="middle">React 19 + Vite</text>
  <text class="s" x="130" y="208" text-anchor="middle">Tailwind 4 · Recharts · Leaflet</text>
  <text class="s" x="130" y="236" text-anchor="middle">Station picker · Weather</text>
  <text class="s" x="130" y="254" text-anchor="middle">Charts · Risk · Map</text>

  <rect class="box" x="330" y="60" width="300" height="280" rx="14"/>
  <text class="t" x="480" y="92" text-anchor="middle">FastAPI Backend</text>
  <rect class="sub" x="352" y="110" width="256" height="60" rx="10"/>
  <text class="h" x="480" y="135" text-anchor="middle">Realtime layer</text>
  <text class="l" x="480" y="155" text-anchor="middle">httpx fetch · normalize · 30 s cache</text>
  <rect class="sub" x="352" y="180" width="256" height="60" rx="10"/>
  <text class="h" x="480" y="205" text-anchor="middle">Model layer · RandomForest ×2</text>
  <text class="l" x="480" y="225" text-anchor="middle">Rentals / returns · heuristic fallback</text>
  <rect class="sub" x="352" y="250" width="256" height="70" rx="10"/>
  <text class="h" x="480" y="275" text-anchor="middle">Forecast layer · /forecast_day</text>
  <text class="l" x="480" y="294" text-anchor="middle">Weather &amp; time factors → hourly</text>
  <text class="l" x="480" y="311" text-anchor="middle">Remaining bikes within capacity</text>

  <rect class="box" x="720" y="60" width="220" height="110" rx="14"/>
  <text class="t" x="830" y="92" text-anchor="middle">Taipei Open Data</text>
  <text class="s" x="830" y="118" text-anchor="middle">YouBike 2.0 realtime API</text>
  <text class="s" x="830" y="138" text-anchor="middle">~1,600 stations · live</text>

  <rect class="box" x="720" y="220" width="220" height="120" rx="14"/>
  <text class="t" x="830" y="252" text-anchor="middle">Local Data</text>
  <text class="s" x="830" y="278" text-anchor="middle">rf_*_model_quick.pkl</text>
  <text class="s" x="830" y="298" text-anchor="middle">stations.csv (fallback list)</text>
  <text class="s" x="830" y="318" text-anchor="middle">hourly / rain / temp CSV</text>

  <path class="ln" d="M230,185 L330,185"/>
  <text class="l" x="280" y="176" text-anchor="middle">/api/*</text>
  <path class="ln" d="M330,225 L230,225"/>
  <text class="l" x="280" y="243" text-anchor="middle">JSON</text>
  <path class="ln" d="M720,125 L608,138"/>
  <path class="ln" d="M720,280 L608,212"/>
</svg>
